<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14171c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Acurácia">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Acurácia de Estoque</title>
<style>
:root{
  --bg:#14171c;
  --surface:#1e232b;
  --surface-alt:#262c35;
  --accent:#ffb020;
  --accent-dim:#8a611c;
  --ok:#2ecc71;
  --warn:#f5a623;
  --danger:#ff5252;
  --pending:#4a5261;
  --text:#eef1f5;
  --text-dim:#98a2b3;
  --border:#303844;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  overscroll-behavior-y:contain;}
body{display:flex;flex-direction:column;min-height:100vh;}
.mono{font-family:ui-monospace,'SFMono-Regular','Courier New',monospace;}

/* hazard stripe */
.hazard{height:6px;background-repeat:repeat-x;background-size:16px 6px;
  background-image:repeating-linear-gradient(-45deg,var(--accent) 0 4px,#14171c 4px 8px);}

header{position:sticky;top:0;z-index:20;background:var(--bg);padding-top:var(--safe-t);
  border-bottom:1px solid var(--border);}
.header-inner{padding:14px 16px 10px;display:flex;align-items:baseline;justify-content:space-between;}
.title{font-family:ui-monospace,'Courier New',monospace;font-weight:700;font-size:22px;
  letter-spacing:2px;text-transform:uppercase;color:var(--text);}
.title span{color:var(--accent);}
.subdate{font-size:13px;color:var(--text-dim);font-family:ui-monospace,'Courier New',monospace;}

main{flex:1;overflow-y:auto;padding:12px 12px calc(180px + var(--safe-b));}
.view{display:none;}
.view.active{display:block;}

/* item row */
.item{background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:10px;margin-bottom:8px;display:flex;align-items:center;gap:10px;}
.status-btn{flex:0 0 auto;width:46px;height:46px;border-radius:10px;border:1px solid var(--border);
  background:var(--surface-alt);font-size:22px;display:flex;align-items:center;justify-content:center;
  transition:transform .08s ease;}
.status-btn:active{transform:scale(.9);}
.status-btn[data-status="ok"]{border-color:var(--ok);background:#173324;}
.status-btn[data-status="warn"]{border-color:var(--warn);background:#3a2c10;}
.status-btn[data-status="question"]{border-color:var(--danger);background:#3a1414;}
.status-btn[data-status="pending"]{border-color:var(--pending);color:var(--pending);background:var(--surface-alt);}

.item-body{flex:1;min-width:0;}
.item-name{width:100%;background:transparent;border:none;color:var(--text);font-size:14.5px;
  font-weight:600;padding:2px 0;outline:none;}
.item-unit-row{display:flex;gap:6px;align-items:center;margin-top:4px;}
.item-unit{background:transparent;border:none;color:var(--text-dim);font-size:12px;width:56px;
  outline:none;font-family:ui-monospace,monospace;}

.qty-wrap{flex:0 0 auto;display:flex;align-items:center;gap:4px;background:var(--surface-alt);
  border:1px solid var(--border);border-radius:9px;padding:3px;}
.qty-btn{width:30px;height:30px;border:none;background:transparent;color:var(--accent);
  font-size:18px;font-weight:700;border-radius:6px;}
.qty-btn:active{background:var(--border);}
.qty-input{width:44px;text-align:center;background:transparent;border:none;color:var(--text);
  font-size:15px;font-weight:700;font-family:ui-monospace,monospace;outline:none;}

/* config view */
.config-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:10px;margin-bottom:8px;}
.config-row{display:flex;gap:8px;margin-top:6px;}
.config-row input{flex:1;background:var(--surface-alt);border:1px solid var(--border);
  border-radius:7px;color:var(--text);padding:8px;font-size:13.5px;outline:none;}
.config-label{font-size:10.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;
  margin-bottom:2px;display:block;}

/* bottom tab bar - one-hand reach */
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);
  border-top:1px solid var(--border);padding-bottom:var(--safe-b);
  display:flex;}
nav.tabbar button{flex:1;background:none;border:none;color:var(--text-dim);padding:9px 4px 8px;
  font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-family:ui-monospace,monospace;letter-spacing:.5px;text-transform:uppercase;}
nav.tabbar button .ic{font-size:19px;}
nav.tabbar button.active{color:var(--accent);}

/* action bar above tabbar */
.actionbar{position:fixed;left:0;right:0;bottom:calc(56px + var(--safe-b));z-index:25;
  background:linear-gradient(180deg, rgba(20,23,28,0) 0%, var(--bg) 30%);
  padding:14px 12px 8px;display:flex;gap:8px;}
.actionbar.hidden{display:none;}
.abtn{flex:1;border:none;border-radius:10px;padding:12px 6px;font-size:12.5px;font-weight:700;
  font-family:ui-monospace,monospace;text-transform:uppercase;letter-spacing:.5px;
  display:flex;flex-direction:column;align-items:center;gap:2px;}
.abtn .ic{font-size:17px;}
.abtn.primary{background:var(--accent);color:#1a1400;}
.abtn.secondary{background:var(--surface-alt);color:var(--text);border:1px solid var(--border);}
.abtn.danger-outline{background:var(--surface-alt);color:var(--danger);border:1px solid #5a2626;}

/* resumo card */
.resumo{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;
  margin-bottom:10px;display:flex;justify-content:space-around;text-align:center;}
.resumo .num{font-size:20px;font-weight:800;font-family:ui-monospace,monospace;}
.resumo .lbl{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;}

/* history */
.hist-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:12px;margin-bottom:9px;}
.hist-top{display:flex;justify-content:space-between;align-items:center;}
.hist-date{font-family:ui-monospace,monospace;font-weight:700;font-size:15px;}
.hist-pct{font-family:ui-monospace,monospace;font-weight:800;font-size:15px;color:var(--ok);}
.hist-bar{height:6px;border-radius:3px;background:var(--surface-alt);margin-top:8px;overflow:hidden;}
.hist-bar-fill{height:100%;background:var(--ok);}
.hist-actions{display:flex;gap:8px;margin-top:10px;}
.hist-actions button{flex:1;background:var(--surface-alt);border:1px solid var(--border);
  color:var(--text);border-radius:7px;padding:8px;font-size:12px;font-family:ui-monospace,monospace;}
.hist-actions button.del{color:var(--danger);}

.empty{text-align:center;color:var(--text-dim);padding:40px 20px;font-size:13.5px;}
.empty .ic{font-size:34px;display:block;margin-bottom:8px;}

/* chart */
.chart-wrap{background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:14px 10px;margin-bottom:12px;}
.chart-title{font-family:ui-monospace,monospace;font-size:12px;color:var(--text-dim);
  text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;}

/* preview / modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;
  align-items:flex-end;}
.modal-bg.hidden{display:none;}
.modal{background:var(--surface);border-radius:16px 16px 0 0;padding:16px;width:100%;
  max-height:80vh;overflow-y:auto;padding-bottom:calc(16px + var(--safe-b));}
.modal h3{margin:0 0 10px;font-family:ui-monospace,monospace;font-size:14px;
  text-transform:uppercase;letter-spacing:1px;color:var(--accent);}
.modal pre{white-space:pre-wrap;word-break:break-word;background:var(--surface-alt);
  border:1px solid var(--border);border-radius:9px;padding:12px;font-size:13px;
  font-family:ui-monospace,monospace;line-height:1.5;color:var(--text);}
.modal-actions{display:flex;gap:8px;margin-top:12px;}
.modal-actions button{flex:1;border:none;border-radius:9px;padding:12px;font-size:13px;
  font-weight:700;font-family:ui-monospace,monospace;}
.modal-actions .wa{background:var(--ok);color:#062012;}
.modal-actions .copy{background:var(--accent);color:#1a1400;}
.modal-actions .close{background:var(--surface-alt);color:var(--text-dim);border:1px solid var(--border);}

.toast{position:fixed;left:50%;bottom:calc(150px + var(--safe-b));transform:translateX(-50%);
  background:var(--accent);color:#1a1400;padding:9px 18px;border-radius:20px;font-size:12.5px;
  font-weight:700;z-index:60;opacity:0;transition:opacity .25s ease;pointer-events:none;
  font-family:ui-monospace,monospace;}
.toast.show{opacity:1;}

#printArea{display:none;}

@media print{
  @page{ margin:14mm 12mm; }
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  header,nav.tabbar,.actionbar,.modal-bg,.toast{display:none !important;}
  #printArea{display:block !important;position:absolute;top:0;left:0;width:100%;background:#fff;color:#111;}

  .pr-header{display:flex;justify-content:space-between;align-items:flex-end;
    border-bottom:3px solid #111;padding-bottom:8px;margin-bottom:14px;}
  .pr-title{font-family:Georgia,'Times New Roman',serif;font-size:24px;font-weight:700;
    letter-spacing:.5px;margin:0;}
  .pr-sub{font-size:11px;color:#555;margin-top:2px;font-family:Georgia,serif;}
  .pr-date{font-family:'Courier New',monospace;font-size:15px;font-weight:700;text-align:right;}
  .pr-date small{display:block;font-weight:400;font-size:9.5px;color:#666;letter-spacing:1px;
    text-transform:uppercase;}

  table.pr-table{width:100%;border-collapse:collapse;font-size:11.5px;margin-bottom:14px;}
  table.pr-table th{text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;
    color:#555;border-bottom:1.5px solid #111;padding:5px 6px;}
  table.pr-table td{padding:5px 6px;border-bottom:1px solid #ddd;vertical-align:middle;}
  table.pr-table tr{break-inside:avoid;}
  table.pr-table td.pr-status{width:26px;text-align:center;font-size:13px;}
  table.pr-table td.pr-qty{width:50px;font-family:'Courier New',monospace;font-weight:700;text-align:right;}
  table.pr-table td.pr-unit{width:60px;color:#666;font-family:'Courier New',monospace;font-size:10.5px;}
  table.pr-table tr.pr-pending td{color:#aaa;}
  table.pr-table tr.pr-warn td{background:#fdf3e0;}
  table.pr-table tr.pr-warn td.pr-name{font-weight:600;}
  table.pr-table tr.pr-question td{background:#fbe6e6;}
  table.pr-table tr.pr-question td.pr-name{font-weight:600;}

  .pr-notes{font-size:10px;color:#555;line-height:1.6;margin-bottom:14px;padding:8px 10px;
    border-left:3px solid #ccc;}

  .pr-resumo{display:flex;gap:0;border:1.5px solid #111;border-radius:4px;overflow:hidden;
    margin-bottom:10px;}
  .pr-resumo > div{flex:1;text-align:center;padding:10px 4px;border-right:1px solid #111;}
  .pr-resumo > div:last-child{border-right:none;}
  .pr-resumo .pr-num{font-family:'Courier New',monospace;font-size:19px;font-weight:800;display:block;}
  .pr-resumo .pr-lbl{font-size:8.5px;text-transform:uppercase;letter-spacing:.8px;color:#555;
    display:block;margin-top:2px;}

  .pr-footer{font-size:8.5px;color:#999;text-align:right;margin-top:6px;
    font-family:'Courier New',monospace;}
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="title">Acurácia<span>.</span></div>
    <div class="subdate" id="todayLabel"></div>
  </div>
  <div class="hazard"></div>
</header>

<main>

  <!-- CONFERÊNCIA -->
  <section class="view active" id="view-conf">
    <div class="resumo" id="resumoBox"></div>
    <div id="itemList"></div>
  </section>

  <!-- HISTÓRICO -->
  <section class="view" id="view-hist">
    <div id="histList"></div>
  </section>

  <!-- GRÁFICO -->
  <section class="view" id="view-chart">
    <div class="chart-wrap">
      <div class="chart-title">% de itens ✅ por conferência</div>
      <svg id="chartSvg" width="100%" viewBox="0 0 320 180" style="display:block"></svg>
    </div>
  </section>

  <!-- CONFIG -->
  <section class="view" id="view-config">
    <div class="config-item" style="border-color:var(--accent);">
      <span class="config-label" style="color:var(--accent);">Trocar lista da semana (cola tudo de uma vez)</span>
      <textarea id="bulkPaste" rows="6" placeholder="Um material por linha. Ex:&#10;Cabo Flexível 2,5mm | Rolo&#10;Fita Isolante | unid.&#10;Conector Wago | Cx&#10;&#10;(se não colocar | unidade, usa 'unid.' automático)"
        style="width:100%;background:var(--surface-alt);border:1px solid var(--border);border-radius:8px;
        color:var(--text);padding:9px;font-size:13px;font-family:ui-monospace,monospace;outline:none;resize:vertical;margin-top:6px;"></textarea>
      <div style="display:flex;gap:8px;margin-top:8px;">
        <button id="btnBulkApply" style="flex:1;background:var(--accent);color:#1a1400;border:none;
          border-radius:8px;padding:11px;font-weight:700;font-size:12.5px;font-family:ui-monospace,monospace;
          text-transform:uppercase;">Substituir lista</button>
      </div>
      <div style="font-size:11px;color:var(--text-dim);margin-top:6px;">
        ⚠️ A conferência atual (a de hoje) é salva no histórico antes de trocar a lista, e as quantidades/status são zerados para a nova semana.
      </div>
    </div>
    <div id="configList"></div>
    <button id="btnAddItem" style="width:100%;background:var(--surface-alt);border:1px dashed var(--border);
      color:var(--accent);border-radius:10px;padding:12px;font-size:13px;font-weight:700;
      font-family:ui-monospace,monospace;margin-bottom:20px;">+ Adicionar material</button>
  </section>

</main>

<div class="actionbar" id="actionBar">
  <button class="abtn secondary" id="btnClearDay"><span class="ic">🧹</span>Limpar dia</button>
  <button class="abtn secondary" id="btnPdf"><span class="ic">📄</span>PDF</button>
  <button class="abtn primary" id="btnGenerate"><span class="ic">📋</span>Gerar</button>
</div>

<nav class="tabbar">
  <button class="tab-btn active" data-view="conf"><span class="ic">📦</span>Conferência</button>
  <button class="tab-btn" data-view="hist"><span class="ic">🗂️</span>Histórico</button>
  <button class="tab-btn" data-view="chart"><span class="ic">📊</span>Gráfico</button>
  <button class="tab-btn" data-view="config"><span class="ic">⚙️</span>Itens</button>
</nav>

<div class="modal-bg hidden" id="modalBg">
  <div class="modal">
    <h3>Mensagem gerada</h3>
    <pre id="modalText"></pre>
    <div class="modal-actions">
      <button class="close" id="modalClose">Fechar</button>
      <button class="copy" id="modalCopy">Copiar</button>
      <button class="wa" id="modalWa">WhatsApp</button>
    </div>
  </div>
</div>

<div id="printArea"></div>

<div class="toast" id="toast"></div>

<script>
/* ================= DADOS PADRÃO ================= */
const DEFAULT_ITEMS = [
  ["Lâmpada T8 9W","unid.",118,"ok"],
  ["Pu 40 Branco Bisnaga","unid.",17,"warn"],
  ["Pu 40 Cinza","unid.",60,"warn"],
  ["Joelho 90⁰ 25DN água fria","unid.",114,"warn"],
  ["Te 20DN água fria","unid.",123,"warn"],
  ["Registro Esfera 25DN Água fria","unid.",104,"ok"],
  ["Adaptador 25x3/4","unid.",95,"warn"],
  ["Jogo dobradiça 3,5\"x2\"","unid.",46,"warn"],
  ["Escova de Aço manual","unid.",9,"warn"],
  ["Fita Crepe Fina","unid.",93,"warn"],
  ["Disjuntor Mono Curva C 40A","unid.",93,"ok"],
  ["Disjuntor Mono Curva C 63A","unid.",58,"warn"],
  ["Disjuntor Mono Curva C 25A","unid.",66,"ok"],
  ["Disjuntor Mono Curva C 20A","unid.",20,"ok"],
  ["Disjuntor Mono Curva C 50A","unid.",96,"ok"],
  ["Disjuntor Mono Curva C 10A","unid.",31,"ok"],
  ["Disjuntor Mono Curva C 16A","unid.",9,"warn"],
  ["Disjuntor Mono Curva C 32A","unid.",64,"ok"],
  ["Disjuntor Bipolar Curva C 40A","unid.",30,"warn"],
  ["Disjuntor Bipolar Curva C 63A","unid.",54,"ok"],
  ["Disjuntor Bipolar Curva C 25A","unid.",33,"ok"],
  ["Disjuntor Bipolar Curva C 20A","unid.",23,"warn"],
  ["Disjuntor Bipolar Curva C 50A","unid.",16,"warn"],
  ["Disjuntor Bipolar Curva C 10A","unid.",37,"ok"],
  ["Disjuntor Bipolar Curva C 16A","unid.",47,"warn"],
  ["Disjuntor Bipolar Curva C 32A","unid.",32,"ok"],
  ["Chuveiro 220V C/DR","unid.",14,"warn"],
  ["Válvula Americana Pia 3.1/2x1.1/2","unid.",77,"ok"],
  ["Espaçador 1,5mm","Pacote",74,"warn"],
  ["Espaçador 2,0mm","Pacote",85,"warn"],
].map((r,i)=>({id:"it"+i, name:r[0], unit:r[1]}));

const STATUS_CYCLE = ["pending","ok","warn","question"];
const STATUS_EMOJI = {pending:"⬜", ok:"✅", warn:"⚠️", question:"❓"};

const LS_ITEMS = "acuracia_itens_v1";
const LS_CONF  = "acuracia_conf_atual_v1";
const LS_HIST  = "acuracia_historico_v1";

/* ================= ESTADO ================= */
let itemsConfig = loadItemsConfig();
let conf = loadConf();      // { date: "YYYY-MM-DD", values: { id: {qty, status} } }
let hist = loadHist();      // [ { date, ddmm, values, ok, warn, question, pct } ]

function todayISO(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function isoToDDMM(iso){
  const [y,m,d] = iso.split("-");
  return d+"/"+m;
}

function loadItemsConfig(){
  try{
    const raw = localStorage.getItem(LS_ITEMS);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  saveItemsConfig(DEFAULT_ITEMS);
  return JSON.parse(JSON.stringify(DEFAULT_ITEMS));
}
function saveItemsConfig(v){ localStorage.setItem(LS_ITEMS, JSON.stringify(v)); }

function loadConf(){
  try{
    const raw = localStorage.getItem(LS_CONF);
    if(raw){
      const parsed = JSON.parse(raw);
      // se mudou o dia, mantemos os valores (não apaga automaticamente - usuário decide "limpar dia")
      return parsed;
    }
  }catch(e){}
  return freshConf();
}
function freshConf(){
  const values = {};
  itemsConfig.forEach(it=>{ values[it.id] = {qty:0, status:"pending"}; });
  return { date: todayISO(), values };
}
function saveConf(){ localStorage.setItem(LS_CONF, JSON.stringify(conf)); }

function loadHist(){
  try{
    const raw = localStorage.getItem(LS_HIST);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return [];
}
function saveHist(){ localStorage.setItem(LS_HIST, JSON.stringify(hist)); }

// garante que todo item cadastrado tenha um valor na conferência atual
function ensureConfShape(){
  itemsConfig.forEach(it=>{
    if(!conf.values[it.id]) conf.values[it.id] = {qty:0, status:"pending"};
  });
}
ensureConfShape();

/* ================= RENDER: TOPO ================= */
function renderHeaderDate(){
  document.getElementById("todayLabel").textContent = isoToDDMM(todayISO());
}

/* ================= RENDER: LISTA DE CONFERÊNCIA ================= */
function renderResumo(){
  let ok=0,warn=0,question=0,pending=0;
  itemsConfig.forEach(it=>{
    const s = conf.values[it.id]?.status || "pending";
    if(s==="ok")ok++; else if(s==="warn")warn++; else if(s==="question")question++; else pending++;
  });
  const total = itemsConfig.length;
  const conferidos = total - pending;
  const pct = conferidos>0 ? Math.round((ok/conferidos)*100) : 0;
  const box = document.getElementById("resumoBox");
  box.innerHTML = `
    <div><div class="num" style="color:var(--ok)">${ok}</div><div class="lbl">✅ ok</div></div>
    <div><div class="num" style="color:var(--warn)">${warn}</div><div class="lbl">⚠️ ajustado</div></div>
    <div><div class="num" style="color:var(--danger)">${question}</div><div class="lbl">❓ s/ cadastro</div></div>
    <div><div class="num" style="color:var(--text-dim)">${pct}%</div><div class="lbl">precisão</div></div>
  `;
}

function renderItemList(){
  const wrap = document.getElementById("itemList");
  wrap.innerHTML = "";
  itemsConfig.forEach(it=>{
    const val = conf.values[it.id] || {qty:0,status:"pending"};
    const row = document.createElement("div");
    row.className = "item";
    row.innerHTML = `
      <button class="status-btn" data-status="${val.status}" data-id="${it.id}">${STATUS_EMOJI[val.status]}</button>
      <div class="item-body">
        <input class="item-name" data-id="${it.id}" value="${escapeHtml(it.name)}" placeholder="Nome do material">
        <div class="item-unit-row">
          <input class="item-unit" data-id="${it.id}" value="${escapeHtml(it.unit)}" placeholder="unid.">
        </div>
      </div>
      <div class="qty-wrap">
        <button class="qty-btn" data-act="dec" data-id="${it.id}">−</button>
        <input class="qty-input" data-id="${it.id}" type="number" inputmode="numeric" value="${val.qty}">
        <button class="qty-btn" data-act="inc" data-id="${it.id}">+</button>
      </div>
    `;
    wrap.appendChild(row);
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

document.getElementById("itemList").addEventListener("click", (e)=>{
  const statusBtn = e.target.closest(".status-btn");
  if(statusBtn){
    const id = statusBtn.dataset.id;
    const cur = conf.values[id]?.status || "pending";
    const idx = STATUS_CYCLE.indexOf(cur);
    const next = STATUS_CYCLE[(idx+1) % STATUS_CYCLE.length];
    conf.values[id].status = next;
    saveConf();
    renderItemList();
    renderResumo();
    return;
  }
  const qtyBtn = e.target.closest(".qty-btn");
  if(qtyBtn){
    const id = qtyBtn.dataset.id;
    const delta = qtyBtn.dataset.act === "inc" ? 1 : -1;
    conf.values[id].qty = Math.max(0, (conf.values[id].qty||0) + delta);
    saveConf();
    renderItemList();
    return;
  }
});
document.getElementById("itemList").addEventListener("input",(e)=>{
  if(e.target.classList.contains("qty-input")){
    const id = e.target.dataset.id;
    let v = parseInt(e.target.value,10);
    if(isNaN(v) || v<0) v = 0;
    conf.values[id].qty = v;
    saveConf();
    return;
  }
  if(e.target.classList.contains("item-name")){
    const id = e.target.dataset.id;
    const it = itemsConfig.find(x=>x.id===id);
    if(it){ it.name = e.target.value; saveItemsConfig(itemsConfig); }
    return;
  }
  if(e.target.classList.contains("item-unit")){
    const id = e.target.dataset.id;
    const it = itemsConfig.find(x=>x.id===id);
    if(it){ it.unit = e.target.value; saveItemsConfig(itemsConfig); }
    return;
  }
});

/* ================= GERAÇÃO DE MENSAGEM ================= */
function buildMessage(source){
  // source = { ddmm, values(map id->{qty,status}) }
  const lines = [];
  lines.push(`*ACURÁCIA ${source.ddmm}*`);
  lines.push("Itens conferidos :");
  let ok=0,warn=0,question=0;
  itemsConfig.forEach(it=>{
    const v = source.values[it.id] || {qty:0,status:"pending"};
    if(v.status==="pending") return; // itens não conferidos não entram na mensagem
    const emoji = STATUS_EMOJI[v.status];
    lines.push(`* ${emoji} ${v.qty} ${it.unit} ${it.name}`);
    if(v.status==="ok") ok++;
    else if(v.status==="warn") warn++;
    else if(v.status==="question") question++;
  });
  lines.push("* Todos os itens em ⚠️ , já foram ajustados devidamente no sistema de estoque.");
  lines.push("* itens com ❓ não estão cadastrados apropriadamente no sistema de estoque,  desvio já sanado.");
  lines.push("          *RESUMO DA ACURÁCIA*");
  lines.push(`* ⚠️ |  ${warn} itens`);
  lines.push(`* ❓ |  ${question} itens`);
  lines.push(`* ✅ |  ${ok} Itens`);
  return lines.join("\n");
}

function currentMessage(){
  return buildMessage({ ddmm: isoToDDMM(todayISO()), values: conf.values });
}

/* ================= MODAL ================= */
const modalBg = document.getElementById("modalBg");
const modalText = document.getElementById("modalText");
function openModal(text){
  modalText.textContent = text;
  modalBg.classList.remove("hidden");
}
document.getElementById("modalClose").onclick = ()=> modalBg.classList.add("hidden");
document.getElementById("modalBg").addEventListener("click",(e)=>{ if(e.target===modalBg) modalBg.classList.add("hidden"); });

document.getElementById("modalCopy").onclick = async ()=>{
  try{
    await navigator.clipboard.writeText(modalText.textContent);
    showToast("Copiado ✅");
  }catch(e){
    fallbackCopy(modalText.textContent);
  }
};
document.getElementById("modalWa").onclick = ()=>{
  const text = encodeURIComponent(modalText.textContent);
  if(navigator.share){
    navigator.share({ text: modalText.textContent }).catch(()=>{
      window.open("https://wa.me/?text="+text, "_blank");
    });
  } else {
    window.open("https://wa.me/?text="+text, "_blank");
  }
};

function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try{ document.execCommand("copy"); showToast("Copiado ✅"); }catch(e){ showToast("Não foi possível copiar"); }
  document.body.removeChild(ta);
}

document.getElementById("btnGenerate").onclick = ()=>{
  openModal(currentMessage());
};

/* ================= TOAST ================= */
let toastTimer=null;
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove("show"), 1800);
}

/* ================= LIMPAR DIA ================= */
document.getElementById("btnClearDay").onclick = ()=>{
  if(!confirm("Limpar a conferência de hoje? Os 30 materiais cadastrados serão mantidos, apenas as quantidades e status serão zerados.")) return;
  conf = freshConf();
  saveConf();
  renderItemList();
  renderResumo();
  showToast("Conferência do dia limpa");
};

/* ================= FINALIZAR / SALVAR NO HISTÓRICO (automático no PDF/gerar) ================= */
function commitToHistory(){
  const iso = todayISO();
  const ddmm = isoToDDMM(iso);
  let ok=0,warn=0,question=0,pending=0;
  itemsConfig.forEach(it=>{
    const s = conf.values[it.id]?.status || "pending";
    if(s==="ok")ok++; else if(s==="warn")warn++; else if(s==="question")question++; else pending++;
  });
  const conferidos = ok+warn+question;
  const pct = conferidos>0 ? Math.round((ok/conferidos)*100) : 0;
  const snapshot = {
    date: iso, ddmm,
    values: JSON.parse(JSON.stringify(conf.values)),
    itemsSnapshot: JSON.parse(JSON.stringify(itemsConfig)),
    ok, warn, question, pct
  };
  const existingIdx = hist.findIndex(h=>h.date===iso);
  if(existingIdx>=0) hist[existingIdx] = snapshot;
  else hist.push(snapshot);
  hist.sort((a,b)=> a.date.localeCompare(b.date));
  saveHist();
}

/* ================= HISTÓRICO: RENDER ================= */
function renderHist(){
  const wrap = document.getElementById("histList");
  if(hist.length===0){
    wrap.innerHTML = `<div class="empty"><span class="ic">🗂️</span>Nenhuma conferência salva ainda.<br>Toque em "Gerar" ou "PDF" para registrar o dia no histórico.</div>`;
    return;
  }
  wrap.innerHTML = "";
  [...hist].reverse().forEach(h=>{
    const card = document.createElement("div");
    card.className = "hist-card";
    card.innerHTML = `
      <div class="hist-top">
        <div class="hist-date">${h.ddmm}</div>
        <div class="hist-pct">${h.pct}% ✅</div>
      </div>
      <div class="hist-bar"><div class="hist-bar-fill" style="width:${h.pct}%"></div></div>
      <div style="font-size:11.5px;color:var(--text-dim);margin-top:6px;">
        ✅ ${h.ok} &nbsp; ⚠️ ${h.warn} &nbsp; ❓ ${h.question}
      </div>
      <div class="hist-actions">
        <button data-act="view" data-date="${h.date}">Ver mensagem</button>
        <button data-act="del" data-date="${h.date}" class="del">Excluir</button>
      </div>
    `;
    wrap.appendChild(card);
  });
}
document.getElementById("histList").addEventListener("click",(e)=>{
  const btn = e.target.closest("button[data-act]");
  if(!btn) return;
  const date = btn.dataset.date;
  const h = hist.find(x=>x.date===date);
  if(!h) return;
  if(btn.dataset.act==="view"){
    // reconstrói mensagem usando os itens salvos naquele snapshot
    const oldItemsConfig = itemsConfig;
    itemsConfig = h.itemsSnapshot;
    const msg = buildMessage({ ddmm: h.ddmm, values: h.values });
    itemsConfig = oldItemsConfig;
    openModal(msg);
  } else if(btn.dataset.act==="del"){
    if(confirm(`Excluir a conferência de ${h.ddmm} do histórico?`)){
      hist = hist.filter(x=>x.date!==date);
      saveHist();
      renderHist();
      renderChart();
    }
  }
});

/* ================= GRÁFICO ================= */
function renderChart(){
  const svg = document.getElementById("chartSvg");
  const W=320,H=180,padL=26,padB=22,padT=10,padR=6;
  const plotW = W-padL-padR, plotH = H-padT-padB;
  if(hist.length===0){
    svg.innerHTML = `<text x="${W/2}" y="${H/2}" fill="#98a2b3" font-size="11" text-anchor="middle" font-family="ui-monospace,monospace">Sem dados ainda</text>`;
    return;
  }
  const data = hist.slice(-10); // últimos 10
  const barW = plotW/data.length;
  let svgParts = [];
  // grid lines 0/50/100
  [0,50,100].forEach(v=>{
    const y = padT + plotH - (v/100)*plotH;
    svgParts.push(`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#303844" stroke-width="1"/>`);
    svgParts.push(`<text x="${padL-4}" y="${y+3}" fill="#98a2b3" font-size="8" text-anchor="end" font-family="ui-monospace,monospace">${v}</text>`);
  });
  data.forEach((h,i)=>{
    const bh = (h.pct/100)*plotH;
    const x = padL + i*barW + barW*0.2;
    const w = barW*0.6;
    const y = padT + plotH - bh;
    svgParts.push(`<rect x="${x}" y="${y}" width="${w}" height="${bh}" rx="3" fill="#2ecc71"/>`);
    svgParts.push(`<text x="${x+w/2}" y="${y-4}" fill="#eef1f5" font-size="8.5" text-anchor="middle" font-family="ui-monospace,monospace">${h.pct}%</text>`);
    svgParts.push(`<text x="${x+w/2}" y="${H-6}" fill="#98a2b3" font-size="8" text-anchor="middle" font-family="ui-monospace,monospace">${h.ddmm}</text>`);
  });
  svg.innerHTML = svgParts.join("");
}

/* ================= CONFIG (editar itens cadastrados) ================= */
function renderConfig(){
  const wrap = document.getElementById("configList");
  wrap.innerHTML = "";
  itemsConfig.forEach((it,idx)=>{
    const card = document.createElement("div");
    card.className = "config-item";
    card.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span class="config-label">Item ${idx+1}</span>
        <button data-act="del-item" data-id="${it.id}" style="background:none;border:none;color:var(--danger);
          font-size:11px;font-family:ui-monospace,monospace;padding:2px 6px;">✕ remover</button>
      </div>
      <div class="config-row">
        <div style="flex:2">
          <input data-field="name" data-id="${it.id}" value="${escapeHtml(it.name)}" placeholder="Nome do material">
        </div>
        <div style="flex:1">
          <input data-field="unit" data-id="${it.id}" value="${escapeHtml(it.unit)}" placeholder="unid.">
        </div>
      </div>
    `;
    wrap.appendChild(card);
  });
}
document.getElementById("configList").addEventListener("change",(e)=>{
  const field = e.target.dataset.field;
  const id = e.target.dataset.id;
  if(!field) return;
  const it = itemsConfig.find(x=>x.id===id);
  if(it){
    it[field] = e.target.value;
    saveItemsConfig(itemsConfig);
    renderItemList();
  }
});
document.getElementById("configList").addEventListener("click",(e)=>{
  const btn = e.target.closest("button[data-act='del-item']");
  if(!btn) return;
  const id = btn.dataset.id;
  const it = itemsConfig.find(x=>x.id===id);
  if(!it) return;
  if(!confirm(`Remover "${it.name}" da lista?`)) return;
  itemsConfig = itemsConfig.filter(x=>x.id!==id);
  delete conf.values[id];
  saveItemsConfig(itemsConfig);
  saveConf();
  renderConfig();
  renderItemList();
  renderResumo();
});

let nextItemSeq = itemsConfig.length;
document.getElementById("btnAddItem").addEventListener("click", ()=>{
  nextItemSeq++;
  const id = "it_new_"+Date.now()+"_"+nextItemSeq;
  itemsConfig.push({ id, name:"Novo material", unit:"unid." });
  conf.values[id] = { qty:0, status:"pending" };
  saveItemsConfig(itemsConfig);
  saveConf();
  renderConfig();
  renderItemList();
  renderResumo();
});

/* Substituir toda a lista de uma vez (troca semanal) */
document.getElementById("btnBulkApply").addEventListener("click", ()=>{
  const raw = document.getElementById("bulkPaste").value;
  const lines = raw.split("\n").map(l=>l.trim()).filter(l=>l.length>0);
  if(lines.length===0){
    showToast("Cole ao menos um material");
    return;
  }
  if(!confirm(`Isso vai substituir os ${itemsConfig.length} materiais atuais por ${lines.length} novos.\n\nA conferência de hoje será salva no histórico antes da troca. Continuar?`)) return;

  // salva o estado atual no histórico antes de trocar (se algo já foi conferido)
  const jaConferiu = Object.values(conf.values).some(v=>v.status!=="pending");
  if(jaConferiu) commitToHistory();

  const newItems = lines.map((line, i)=>{
    let name = line, unit = "unid.";
    if(line.includes("|")){
      const parts = line.split("|");
      name = parts[0].trim();
      unit = (parts[1]||"unid.").trim() || "unid.";
    }
    return { id: "it"+Date.now()+"_"+i, name, unit };
  });

  itemsConfig = newItems;
  saveItemsConfig(itemsConfig);
  conf = freshConf();
  saveConf();

  document.getElementById("bulkPaste").value = "";
  renderConfig();
  renderItemList();
  renderResumo();
  showToast(`Lista atualizada: ${newItems.length} materiais`);
  // volta para a aba de conferência para já começar a marcar
  document.querySelector('.tab-btn[data-view="conf"]').click();
});

/* ================= PDF (via impressão do navegador, com layout formatado) ================= */
function buildPrintHTML(){
  const iso = todayISO();
  const ddmm = isoToDDMM(iso);
  const [y,m,d] = iso.split("-");
  let ok=0,warn=0,question=0,pending=0;
  const rows = itemsConfig.map(it=>{
    const v = conf.values[it.id] || {qty:0,status:"pending"};
    if(v.status==="ok")ok++; else if(v.status==="warn")warn++;
    else if(v.status==="question")question++; else pending++;
    const emoji = STATUS_EMOJI[v.status];
    const cls = "pr-"+v.status;
    return `<tr class="${cls}">
      <td class="pr-status">${emoji}</td>
      <td class="pr-qty">${v.qty}</td>
      <td class="pr-unit">${escapeHtml(it.unit)}</td>
      <td class="pr-name">${escapeHtml(it.name)}</td>
    </tr>`;
  }).join("");
  const conferidos = ok+warn+question;
  const pct = conferidos>0 ? Math.round((ok/conferidos)*100) : 0;
  const agora = new Date();
  const geradoEm = String(agora.getDate()).padStart(2,"0")+"/"+String(agora.getMonth()+1).padStart(2,"0")+"/"+agora.getFullYear()+
    " "+String(agora.getHours()).padStart(2,"0")+":"+String(agora.getMinutes()).padStart(2,"0");

  return `
    <div class="pr-header">
      <div>
        <p class="pr-title">Acurácia de Estoque</p>
        <p class="pr-sub">Relatório de conferência</p>
      </div>
      <div class="pr-date">${ddmm}/${y}<small>Data da conferência</small></div>
    </div>
    <table class="pr-table">
      <thead><tr><th></th><th>Qtd</th><th>Un.</th><th>Material</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="pr-notes">
      * Itens em ⚠️ já foram ajustados devidamente no sistema de estoque.<br>
      * Itens em ❓ não estão cadastrados apropriadamente no sistema de estoque, desvio já sanado.
    </div>
    <div class="pr-resumo">
      <div><span class="pr-num">${ok}</span><span class="pr-lbl">✅ Corretos</span></div>
      <div><span class="pr-num">${warn}</span><span class="pr-lbl">⚠️ Ajustados</span></div>
      <div><span class="pr-num">${question}</span><span class="pr-lbl">❓ S/ cadastro</span></div>
      <div><span class="pr-num">${pct}%</span><span class="pr-lbl">Precisão</span></div>
    </div>
    <div class="pr-footer">Gerado em ${geradoEm} • Acurácia de Estoque</div>
  `;
}

document.getElementById("btnPdf").onclick = ()=>{
  document.getElementById("printArea").innerHTML = buildPrintHTML();
  commitToHistory();
  renderHist();
  renderChart();
  setTimeout(()=>window.print(), 80);
};

/* também salva no histórico ao gerar mensagem, garantindo o gráfico atualizado */
document.getElementById("btnGenerate").addEventListener("click", ()=>{
  commitToHistory();
  renderHist();
  renderChart();
});

/* ================= NAVEGAÇÃO (abas) ================= */
const views = { conf:"view-conf", hist:"view-hist", chart:"view-chart", config:"view-config" };
document.querySelectorAll(".tab-btn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    Object.values(views).forEach(id=> document.getElementById(id).classList.remove("active"));

    if(btn.dataset.view==="hist") renderHist();
    if(btn.dataset.view==="chart") renderChart();
    if(btn.dataset.view==="config") renderConfig();
  });
});
